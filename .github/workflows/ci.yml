name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build src/Graphite.App/Graphite.App.csproj -c Release --nologo

      - name: Test
        run: dotnet test src/Graphite.Tests/Graphite.Tests.csproj -c Release --nologo
